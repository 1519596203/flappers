name: Build Android APK

# 触发条件：push 到 main/master，或手动触发
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖（openjdk-17 + SDL2 依赖 + Android 工具链）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jdk-headless \
            build-essential ccache git \
            libffi-dev libssl-dev libltdl-dev \
            libtool autoconf automake \
            python3-dev unzip zip \
            libjpeg-dev libpng-dev \
            zlib1g-dev

      - name: 安装 buildozer + cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: 首次构建 APK（会下载 Android SDK + NDK + SDL2，~3GB，请耐心等）
        run: |
          buildozer android debug 2>&1 | tee build.log
          ls -la bin/

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: sillybird-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
